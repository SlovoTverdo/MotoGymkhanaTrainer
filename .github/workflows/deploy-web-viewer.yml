name: Deploy Web Viewer to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "dist/web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate prebuilt Pages files
        shell: bash
        run: |
          test -f dist/web/index.html
          test -f dist/web/tracks/default-track.json
          test "$(find dist/web -maxdepth 1 -type f -name 'index.*.pck' | wc -l)" -eq 1
          pack_name="$(grep -oE 'index\.[0-9a-f]{16}\.pck' dist/web/index.html | sort -u)"
          test -n "$pack_name"
          test -f "dist/web/$pack_name"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
